name: Appli Android

on:
  push:
    paths:
      - "index.html"
      - "fonts/**"
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Clé de signature (si les secrets sont définis)
        env:
          KEYSTORE_BASE64: ${{ secrets.POSE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pose.jks"
            echo "POSE_KEYSTORE_FILE=$RUNNER_TEMP/pose.jks" >> "$GITHUB_ENV"
          fi

      - name: Construire l'APK
        env:
          POSE_KEYSTORE_PASSWORD: ${{ secrets.POSE_KEYSTORE_PASSWORD }}
          POSE_KEY_ALIAS: ${{ secrets.POSE_KEY_ALIAS }}
          POSE_KEY_PASSWORD: ${{ secrets.POSE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/pose-stenope.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: pose-stenope-apk
          path: pose-stenope.apk

      - name: Publier une release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: pose-stenope.apk
